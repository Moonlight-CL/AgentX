apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentx-backend
  namespace: agentx
  labels:
    app.kubernetes.io/name: agentx-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: agentx
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentx-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentx-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: agentx
    spec:
      serviceAccountName: agentx-backend-sa
      terminationGracePeriodSeconds: 120
      containers:
        - name: backend
          image: agentx/be:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              protocol: TCP
              name: http
          envFrom:
            - configMapRef:
                name: agentx-backend-config
            - secretRef:
                name: agentx-backend-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          startupProbe:
            httpGet:
              path: /ping
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: 8000
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: agentx-backend
