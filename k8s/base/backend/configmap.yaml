apiVersion: v1
kind: ConfigMap
metadata:
  name: agentx-backend-config
  namespace: agentx
  labels:
    app.kubernetes.io/name: agentx-backend
    app.kubernetes.io/component: backend
data:
  APP_ENV: "production"
  STORAGE_BACKEND: "postgresql"
  AWS_REGION: "us-west-2"
  S3_BUCKET_NAME: "<S3_BUCKET_NAME>"
  S3_FILE_PREFIX: "agentx/files"
