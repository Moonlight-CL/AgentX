apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-backend-netpol
  namespace: agentx
  labels:
    app.kubernetes.io/name: agentx-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentx-backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ALB (via VPC CIDR)
    - from:
        - namespaceSelector: {}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # DNS resolution
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # RDS PostgreSQL (adjust CIDR to your VPC)
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - port: 5432
          protocol: TCP
    # HTTPS: AWS APIs (Bedrock, S3, EventBridge, STS, ECR)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
