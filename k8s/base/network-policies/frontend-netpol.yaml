apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentx-frontend-netpol
  namespace: agentx
  labels:
    app.kubernetes.io/name: agentx-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agentx-frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ALB
    - from:
        - namespaceSelector: {}
      ports:
        - port: 80
          protocol: TCP
  egress:
    # DNS resolution only (Nginx serves static files, no outbound calls)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
