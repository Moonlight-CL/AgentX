apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agentx-ingress
  namespace: agentx
  labels:
    app.kubernetes.io/part-of: agentx
  annotations:
    # AWS Load Balancer Controller
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    # Replace with actual ACM certificate ARN
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERTIFICATE_ARN>"
    # SSE streaming: idle timeout must be 900s to match Bedrock read_timeout
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=900
    # Health check for backend target group
    alb.ingress.kubernetes.io/healthcheck-path: /ping
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    # Ingress group: share one ALB for both path rules
    alb.ingress.kubernetes.io/group.name: agentx
    alb.ingress.kubernetes.io/group.order: "1"
spec:
  ingressClassName: alb
  rules:
    - host: <YOUR_DOMAIN>
      http:
        paths:
          # Backend: /api/* routes (APP_ENV=production adds /api prefix to routes)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: agentx-backend
                port:
                  number: 8000
          # Health check endpoints (no /api prefix)
          - path: /ping
            pathType: Exact
            backend:
              service:
                name: agentx-backend
                port:
                  number: 8000
          # Frontend: everything else (SPA catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: agentx-frontend
                port:
                  number: 80
