apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentx-frontend-hpa
  namespace: agentx
  labels:
    app.kubernetes.io/name: agentx-frontend
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: agentx-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
